<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD7gB7FbMFtG1k1vJGVI3XVCyCUNeZIC7M",
        databaseURL: "https://smart-school-e9f86-default-rtdb.asia-southeast1.firebasedatabase.app",
    };

    let db;
    let driver = null;
    let assignedBus = null;
    let allStudents = [];
    let myStudents = [];
    let allStaff = [];
    let currentTripId = null;
    let currentTripType = null;
    let locationWatcherId = null;
    let html5QrCode;
    let activeTripListeners = [];
    let currentChatListener = null;
    let activeCall = { ref: null, data: null, statusListener: null };
    let callHistory = [];
    let notifications = [];

    // --- WebRTC State ---
    let localStream = null;
    let remoteStream = null;
    let peerConnection = null;
    const peerConnectionConfig = {
        'iceServers': [
            { 'urls': 'stun:stun.l.google.com:19302' },
            { 'urls': 'stun:stun1.l.google.com:19302' }
        ]
    };


    // --- UTILS ---
    function showToast(message, isError = false) {
        const t = document.getElementById('toast');
        t.textContent = message;
        t.style.backgroundColor = isError ? '#ef4444' : '#1f2937';
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 4000);
    }

    function logout() {
        if (locationWatcherId) navigator.geolocation.clearWatch(locationWatcherId);
        activeTripListeners.forEach(l => l.ref.off(l.type, l.callback));
        activeTripListeners = [];
        sessionStorage.removeItem('loggedInUser');
        driver = null; assignedBus = null; currentTripId = null; myStudents = [];
        if (currentChatListener) currentChatListener.ref.off('value', currentChatListener.callback);
        document.querySelector('main').classList.add('hidden');
        document.getElementById('login-overlay').classList.remove('hidden');
    }
    
    function cleanupTripListeners() {
        activeTripListeners.forEach(l => l.ref.off(l.type, l.callback));
        activeTripListeners = [];
    }

    async function startLocalStream() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('local-video').srcObject = localStream;
            document.getElementById('toggle-mic-btn').dataset.active = true;
            document.getElementById('toggle-camera-btn').dataset.active = true;
        } catch (error) {
            console.error('Error accessing media devices.', error);
            localStream = null;
        }
    }
    
    function closeMediaStreams() {
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }
        if (remoteStream) {
            remoteStream.getTracks().forEach(track => track.stop());
            remoteStream = null;
        }
        document.getElementById('local-video').srcObject = null;
        document.getElementById('remote-video').srcObject = null;
    }

    async function videoCallStudent(studentId, studentName) {
        if (!driver) return;

        const callModal = document.getElementById('call-modal');
        document.getElementById('active-call-name').textContent = `Calling ${studentName}...`;
        document.getElementById('active-call-status').textContent = 'Ringing...';
        
        document.getElementById('active-call-view').style.display = 'flex';
        document.getElementById('incoming-call-view').style.display = 'none';
        
        callModal.classList.add('active');
        document.getElementById('call-end-btn').onclick = () => endCall('ended');

        await startLocalStream();
        if(!localStream) {
            showToast('Could not access camera or microphone.', true);
            callModal.classList.remove('active');
            return;
        }

        const callRef = db.ref(`calls/${studentId}`).push();
        activeCall.ref = callRef;
        activeCall.data = {
            from: driver.id, fromName: driver.staffName,
            to: studentId, toName: studentName,
            status: 'ringing', timestamp: Date.now()
        };
        await callRef.set(activeCall.data);

        peerConnection = new RTCPeerConnection(peerConnectionConfig);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        peerConnection.onicecandidate = event => {
            if (event.candidate) {
                callRef.child('callerCandidates').push(event.candidate.toJSON());
            }
        };

        remoteStream = new MediaStream();
        document.getElementById('remote-video').srcObject = remoteStream;
        peerConnection.ontrack = event => {
            event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
        };

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        await callRef.child('offer').set({ type: offer.type, sdp: offer.sdp });

        activeCall.statusListener = callRef.on('value', async (snapshot) => {
            const callData = snapshot.val();
            if (!callData) {
                endCall(); return;
            }
            activeCall.data = callData;

            if (callData.answer && peerConnection.currentRemoteDescription?.type !== 'answer') {
                const answerDescription = new RTCSessionDescription(callData.answer);
                await peerConnection.setRemoteDescription(answerDescription);
            }
            
            if (callData.status === 'answered') {
                document.getElementById('active-call-status').textContent = 'Connected';
            } else if (callData.status === 'declined' || callData.status === 'ended') {
                document.getElementById('active-call-status').textContent = 'Call Ended';
                setTimeout(() => endCall(callData.status), 1500);
            }
        });

        callRef.child('calleeCandidates').on('child_added', snapshot => {
            const candidate = new RTCIceCandidate(snapshot.val());
            peerConnection.addIceCandidate(candidate);
        });
    }

    // --- TRIP & LOCATION LOGIC ---
    async function startTrip(tripType) {
        if (!assignedBus) {
            showToast("You are not assigned to a bus. Contact manager.", true);
            return;
        }

        const today = new Date().toISOString().split('T')[0];
        currentTripId = `${today}_${assignedBus.id}_${tripType}`;
        currentTripType = tripType;

        const tripData = {
            id: currentTripId,
            busId: assignedBus.id,
            driverId: driver.id,
            startTime: new Date().toISOString(),
            status: 'active',
            liveStatus: 'On Way',
            tripType: tripType // 'pickup' or 'drop'
        };

        try {
            await Promise.all([
                db.ref(`busTrips/${currentTripId}`).set(tripData),
                db.ref(`buses/${assignedBus.id}/activeTripId`).set(currentTripId)
            ]);

            locationWatcherId = navigator.geolocation.watchPosition(
                (position) => {
                    const { latitude, longitude } = position.coords;
                    db.ref(`busLocations/${assignedBus.id}`).set({
                        lat: latitude,
                        lng: longitude,
                        timestamp: Date.now()
                    });
                },
                (error) => {
                    showToast("Location access denied or failed.", true);
                    console.error("Geolocation Error:", error);
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
            );

            updateTripUI(true, tripType);
            setupTripDataListeners();
            showToast("Trip Started! Location is now being tracked.");
        } catch (error) {
            showToast("Failed to start trip. Check connection.", true);
            console.error("Start Trip Error:", error);
        }
    }

    async function endTrip() {
        if (locationWatcherId) navigator.geolocation.clearWatch(locationWatcherId);
        locationWatcherId = null;
        cleanupTripListeners();

        try {
            await Promise.all([
                db.ref(`busTrips/${currentTripId}/status`).set('ended'),
                db.ref(`busTrips/${currentTripId}/endTime`).set(new Date().toISOString()),
                db.ref(`busLocations/${assignedBus.id}`).remove(),
                db.ref(`buses/${assignedBus.id}/activeTripId`).remove()
            ]);
            
            currentTripId = null;
            currentTripType = null;
            updateTripUI(false);
            showToast("Trip Ended.");
        } catch (error) {
            showToast("Failed to end trip properly.", true);
            console.error("End Trip Error:", error);
        }
    }

    // --- QR SCANNER & ATTENDANCE ---
    async function onScanSuccess(decodedText, decodedResult) {
        html5QrCode.stop().then(() => {
            document.getElementById('qr-reader-container').style.display = 'none';
        }).catch(err => console.log("Failed to stop scanner", err));

        const studentId = decodedText;
        const student = allStudents.find(s => s.id === studentId);
        
        if (student) {
             if (currentTripType === 'pickup') {
                markStudentAsBoarded(student);
            } else if (currentTripType === 'drop') {
                const boardedStudentsRef = db.ref(`busTrips/${currentTripId}/boardedStudents/${student.id}`);
                const snapshot = await boardedStudentsRef.once('value');
                if (snapshot.exists()) {
                    // Already boarded, so this is a drop-off scan
                    dropOffStudent(student);
                } else {
                    // Not boarded yet, so this is a boarding scan (at school)
                    markStudentAsBoarded(student);
                }
            }
        } else {
            showToast(`QR Code invalid. Student not found.`, true);
        }
    }

    function setupTripDataListeners() {
        if (!currentTripId) return;
        
        cleanupTripListeners();

        const boardedRef = db.ref(`busTrips/${currentTripId}/boardedStudents`);
        const droppedOffRef = db.ref(`busTrips/${currentTripId}/droppedOffStudents`);
        const tripTypeRef = db.ref(`busTrips/${currentTripId}/tripType`);

        const updateData = {};

        const onDataChange = () => {
             renderMyStudentsList(updateData.boardedData, updateData.droppedOffData, updateData.tripType);
             renderTripDashboard(updateData.boardedData, updateData.droppedOffData, updateData.tripType);
        };

        const boardedCallback = snapshot => { updateData.boardedData = snapshot.val() || {}; onDataChange(); };
        const droppedOffCallback = snapshot => { updateData.droppedOffData = snapshot.val() || {}; onDataChange(); };
        const tripTypeCallback = snapshot => { updateData.tripType = snapshot.val(); onDataChange(); };

        boardedRef.on('value', boardedCallback);
        droppedOffRef.on('value', droppedOffCallback);
        tripTypeRef.on('value', tripTypeCallback);

        activeTripListeners.push({ ref: boardedRef, callback: boardedCallback });
        activeTripListeners.push({ ref: droppedOffRef, callback: droppedOffCallback });
        activeTripListeners.push({ ref: tripTypeRef, callback: tripTypeCallback });
    }

    function renderTripDashboard(boardedData = {}, droppedOffData = {}, tripType) {
        const container = document.getElementById('trip-dashboard-content');
        if (!container) return;
        
        const boardedCount = Object.keys(boardedData).length;
        const droppedOffCount = Object.keys(droppedOffData).length;
        
        let stats = [];

        if (tripType === 'pickup') {
            const totalAssigned = myStudents.length;
            const pendingCount = totalAssigned - boardedCount;
            stats = [
                { label: 'Total Assigned', value: totalAssigned, color: 'text-gray-800', bg: 'bg-gray-100' },
                { label: 'Picked Up', value: boardedCount, color: 'text-green-800', bg: 'bg-green-100' },
                { label: 'Pending Pickup', value: pendingCount, color: 'text-yellow-800', bg: 'bg-yellow-100' }
            ];
        } else if (tripType === 'drop') {
            const totalToDrop = myStudents.length; // All assigned students are potential drop-offs
            const pendingBoarding = totalToDrop - boardedCount;
            const pendingDrop = boardedCount - droppedOffCount;
             stats = [
                { label: 'To Board', value: pendingBoarding, color: 'text-gray-800', bg: 'bg-gray-100' },
                { label: 'On Bus', value: pendingDrop, color: 'text-yellow-800', bg: 'bg-yellow-100' },
                { label: 'Dropped Off', value: droppedOffCount, color: 'text-blue-800', bg: 'bg-blue-100' }

        } else {
            container.innerHTML = '';
        }

    // --- ETA & COMMUNICATION ---
    async function endCall(status = 'ended') {
        const modal = document.getElementById('call-modal');
        const sound = document.getElementById('call-sound');
        sound.pause();
        sound.currentTime = 0;
        modal.classList.remove('active');
        
        closeMediaStreams();
        if (peerConnection) {
            peerConnection.close();
            peerConnection = null;
        }

        if (activeCall.ref) {
            if (activeCall.statusListener) {
                activeCall.ref.off('value', activeCall.statusListener);
            }
            
            await activeCall.ref.update({ status: status });
            
            const logEntry = {
                ...activeCall.data,
                id: activeCall.ref.key,
                status: status,
                timestamp: Date.now(),
                duration: activeCall.data.status === 'answered' ? Date.now() - activeCall.data.answeredAt : 0
            };

            if (driver && activeCall.data.from) {
                await db.ref(`callHistory/${driver.id}`).push(logEntry);
                await db.ref(`callHistory/${activeCall.data.from}`).push(logEntry);
            }

            setTimeout(() => {
                if(activeCall.ref) activeCall.ref.remove()
            }, 2000);
        }
        
        activeCall = { ref: null, data: null, statusListener: null };
    }

    function setupCommunicationListeners(driverId) {
        const callsRef = db.ref('calls/' + driverId);
        
        callsRef.on('child_added', async (snapshot) => {
            const callData = snapshot.val();
            if (callData.status !== 'ringing' || activeCall.ref) {
                 snapshot.ref.remove(); return;
            }

            activeCall = { ref: snapshot.ref, data: callData, statusListener: null };

            const callModal = document.getElementById('call-modal');
            document.getElementById('call-modal-title').textContent = callData.fromName;
            document.getElementById('incoming-call-view').style.display = 'block';
            document.getElementById('active-call-view').style.display = 'none';
            callModal.classList.add('active');

            const sound = document.getElementById('call-sound');
            sound.play();

            activeCall.statusListener = activeCall.ref.on('value', (snap) => {
                if (!snap.val()) endCall('cancelled');
            });

            document.getElementById('call-answer-btn').onclick = async () => {
                sound.pause(); sound.currentTime = 0;
                
                await startLocalStream();
                if (!localStream) {
                    showToast('Could not access camera or microphone.', true);
                    endCall('declined');
                    return;
                }

                document.getElementById('incoming-call-view').style.display = 'none';
                document.getElementById('active-call-view').style.display = 'flex';
                document.getElementById('active-call-name').textContent = callData.fromName;
                document.getElementById('active-call-status').textContent = 'Connecting...';
                
                await activeCall.ref.update({ status: 'answered', answeredAt: Date.now() });
                activeCall.data.status = 'answered';
                activeCall.data.answeredAt = Date.now();
                
                peerConnection = new RTCPeerConnection(peerConnectionConfig);
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                peerConnection.onicecandidate = event => {
                    if (event.candidate) activeCall.ref.child('calleeCandidates').push(event.candidate.toJSON());
                };

                remoteStream = new MediaStream();
                document.getElementById('remote-video').srcObject = remoteStream;
                peerConnection.ontrack = event => {
                    event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
                };

                const offer = activeCall.data.offer;
                await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
                
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                await activeCall.ref.child('answer').set({ type: answer.type, sdp: answer.sdp });

                activeCall.ref.child('callerCandidates').on('child_added', snapshot => {
                    peerConnection.addIceCandidate(new RTCIceCandidate(snapshot.val()));
                });
            };

            document.getElementById('call-decline-btn').onclick = () => endCall('declined');
            document.getElementById('call-end-btn').onclick = () => endCall('ended');
        });
    }

                const icon = isOutgoing 
                    ? `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5 text-blue-500"><path fill-rule="evenodd" d="M15.22 14.28a.75.75 0 0 0-1.06-1.06l-3.47-3.47V5.75a.75.75 0 0 0-1.5 0v4.47l-1.22-1.22a.75.75 0 0 0-1.06 1.06l2.5 2.5a.75.75 0 0 0 1.06 0l3.75-3.75Z" clip-rule="evenodd" /></svg>`
                    : `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5 text-green-500"><path fill-rule="evenodd" d="M4.78 5.72a.75.75 0 0 1 1.06 1.06l-3.47 3.47h11.91a.75.75 0 0 1 0 1.5H2.37l3.47 3.47a.75.75 0 1 1-1.06 1.06l-4.75-4.75a.75.75 0 0 1 0-1.06l4.75-4.75Z" clip-rule="evenodd" /></svg>`;
                
                return `
                    <div class="p-4 border-b flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            ${icon}
                            <div>
                                <p class="font-semibold">${peer.name || 'Unknown'}</p>
                                <p class="text-xs text-gray-500">${new Date(call.timestamp).toLocaleString()}</p>
                            </div>
                        </div>
                        <span class="text-sm font-semibold text-gray-600">${call.status}</span>
                    </div>`;
            }).join('') || '<p class="p-4 text-center text-gray-500">No calls in your log.</p>';

            modal.classList.add('active');
            
            const closeBtn = document.createElement('button');
            closeBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5 text-gray-700"><path d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z" /></svg>`;
            closeBtn.className = 'p-2 rounded-full hover:bg-gray-100 -mr-2';
            closeBtn.onclick = () => modal.classList.remove('active');

            const header = modal.querySelector('.modal-header');
            if(header.children.length < 2) header.appendChild(closeBtn);
        });
        
        // Make sure modals are closable
        document.querySelectorAll('#chat-list-modal, #call-history-modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if(e.target === modal) {
                    modal.classList.remove('active');
                }
            });
        });
    }

    async function runApp(loggedInUser) {
        document.getElementById('login-overlay').classList.add('hidden');
        document.querySelector('main').classList.remove('hidden');

        try {
            const [busesSnap, studentsSnap, staffSnap, callHistorySnap] = await Promise.all([
                db.ref('buses').once('value'),
                db.ref('students').once('value'),
                db.ref('staff').once('value'),
                db.ref('callHistory/' + loggedInUser.id).orderByChild('timestamp').limitToLast(50).once('value')
            ]);
            
            driver = loggedInUser;
            const allBuses = Object.values(busesSnap.val() || {});
            allStudents = Object.values(studentsSnap.val() || {});
            allStaff = Object.values(staffSnap.val() || {});
            callHistory = Object.values(callHistorySnap.val() || []).sort((a,b) => b.timestamp - a.timestamp);
            
            assignedBus = allBuses.find(b => b.assignedDriverId === driver.id);

            document.getElementById('driver-info').textContent = `Logged in as ${driver.staffName}`;
            if(assignedBus) {
                document.getElementById('bus-info').textContent = `Assigned Bus: ${assignedBus.busNumber} (${assignedBus.registration})`;
                myStudents = allStudents.filter(s => s.transportInfo && s.transportInfo.busId === assignedBus.id);
            } else {
                document.getElementById('bus-info').textContent = "Not assigned to any bus.";
                document.getElementById('start-pickup-trip-btn').disabled = true;
                document.getElementById('start-drop-trip-btn').disabled = true;
            }
            
            setupCommunicationListeners(driver.id);
            setupHeaderButtons();
            
            // Event Listeners
            document.getElementById('start-pickup-trip-btn').addEventListener('click', () => startTrip('pickup'));
            document.getElementById('start-drop-trip-btn').addEventListener('click', () => startTrip('drop'));
            document.getElementById('end-trip-btn').addEventListener('click', () => endTrip());
            document.getElementById('on-way-btn').addEventListener('click', () => setBusStatus('On Way'));
            document.getElementById('stop-traffic-btn').addEventListener('click', () => setBusStatus('Stopped in Traffic'));

            document.getElementById('scan-qr-btn').addEventListener('click', () => {
                document.getElementById('qr-reader-container').style.display = 'flex';
                html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, onScanSuccess, onScanFailure)
                    .catch(err => showToast('Failed to start scanner.', true));
            });
            document.getElementById('close-scanner-btn').addEventListener('click', () => {
                html5QrCode.stop().then(() => {
                    document.getElementById('qr-reader-container').style.display = 'none';
                }).catch(err => console.log("Failed to stop scanner", err));
            });

            document.getElementById('announcement-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                if(!currentTripId) return;
                const message = document.getElementById('announcement-message').value;
                try {
                    await db.ref(`busAnnouncements/${currentTripId}`).push({
                        message: message,
                        timestamp: Date.now(),
                        voice: true
                    });
                    showToast("Announcement sent!");
                    document.getElementById('announcement-message').value = '';
                } catch(err) {
                    showToast("Could not send announcement.", true);
                }
            });

            document.getElementById('toggle-mic-btn').addEventListener('click', () => {
                const micBtn = document.getElementById('toggle-mic-btn');
                const isActive = micBtn.dataset.active === 'true';
                if (localStream) {
                    localStream.getAudioTracks().forEach(track => track.enabled = !isActive);
                    micBtn.dataset.active = !isActive;
                }
            });

            document.getElementById('toggle-camera-btn').addEventListener('click', () => {
                const camBtn = document.getElementById('toggle-camera-btn');
                const isActive = camBtn.dataset.active === 'true';
                if (localStream) {
                    localStream.getVideoTracks().forEach(track => track.enabled = !isActive);
                    camBtn.dataset.active = !isActive;
                }
            });

        } catch (error) {
            console.error("Failed to load data:", error);
            showToast("Could not load required data.", true);
        }
    }
    
    // --- INITIALIZATION ---
    document.addEventListener('DOMContentLoaded', () => {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        html5QrCode = new Html5Qrcode("qr-reader");

        const form = document.getElementById('driver-login-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const mobile = document.getElementById('driver-mobile').value;
            const password = document.getElementById('driver-password').value;
            
            try {
                const snapshot = await db.ref('staff').orderByChild('mobile').equalTo(mobile).once('value');
                if (snapshot.exists()) {
                    const staffData = snapshot.val();
                    const foundDriver = Object.values(staffData).find(s => s.password === password && (s.role || '').toLowerCase().includes('driver'));
                    
                    if (foundDriver) {
                        sessionStorage.setItem('loggedInUser', JSON.stringify(foundDriver));
                        runApp(foundDriver);
                    } else {
                        showToast('Invalid credentials or not a Driver account.', true);
                    }
                } else {
                    showToast('Mobile number not found.', true);
                }
            } catch (err) {
                showToast('Login failed. Check connection.', true);
                console.error(err);
            }
        });
        
        document.getElementById('logout-btn').addEventListener('click', logout);

        let loggedInUser = null;
        try {
            const userData = sessionStorage.getItem('loggedInUser');
            if (userData) loggedInUser = JSON.parse(userData);
        } catch (e) {
            sessionStorage.removeItem('loggedInUser');
        }
        
        if (loggedInUser && (loggedInUser.role || '').toLowerCase().includes('driver')) {
            runApp(loggedInUser);
        } else {
            document.getElementById('login-overlay').classList.remove('hidden');
        }
    });

</script>
